name: Deploy NONO backend functions

# Deploys NONO's Supabase edge functions from Jamesodigie/NONO-app.
# Runs here because this repo is public (free build minutes).
# Database changes are normally applied through the Supabase connector (the live
# migration history uses different version numbers). For a large migration,
# "migration" names one file in supabase/migrations/ to run once through the
# Supabase Management API; it is recorded in the live migration history.
# Needs repository secrets: NONO_REPO_TOKEN (already set), SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit of NONO-app"
        default: main
      functions:
        description: "Functions to deploy (space separated)"
        default: "psb-wallet psb-webhook psb-reconcile psb-admin group-payouts refresh-blocked-domains"
      remove:
        description: "Functions to delete from Supabase (space separated, optional)"
        default: ""
      migration:
        description: "Migration file name to apply once (optional, e.g. 20261116070000_support_centre.sql)"
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPERBASE_ACCESS_TOKEN }}
      PROJECT_REF: jjqodqjlaqmqofcakrij
    steps:
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret to this repo first."; exit 1
          fi
      - name: Get the NONO code
        uses: actions/checkout@v7
        with:
          repository: Jamesodigie/NONO-app
          ref: ${{ inputs.ref }}
          token: ${{ secrets.NONO_REPO_TOKEN }}
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Apply migration
        if: ${{ inputs.migration != '' }}
        env:
          MIG: ${{ inputs.migration }}
        run: |
          [[ "$MIG" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]] || { echo "bad migration name"; exit 1; }
          f="supabase/migrations/$MIG"; [ -f "$f" ] || { echo "no such file"; exit 1; }
          ver="${MIG%%_*}"; name="${MIG#*_}"; name="${name%.sql}"
          q=$(jq -Rs --arg v "$ver" --arg n "$name" '{query: (. + "\ninsert into supabase_migrations.schema_migrations(version, name) values (\u0027" + $v + "\u0027, \u0027" + $n + "\u0027) on conflict do nothing;")}' "$f")
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data "$q")
          head -c 2000 out.json; echo
          [ "$code" -lt 300 ] || { echo "::error::migration failed ($code)"; exit 1; }
      - name: Deploy functions
        env:
          FUNCS: ${{ inputs.functions }}
        run: |
          for f in $FUNCS; do
            [[ "$f" =~ ^[a-z0-9-]+$ ]] || { echo "bad name $f"; exit 1; }
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api --yes
          done
      - name: Delete retired functions
        if: ${{ inputs.remove != '' }}
        env:
          OLD: ${{ inputs.remove }}
        run: |
          for f in $OLD; do
            [[ "$f" =~ ^[a-z0-9-]+$ ]] || { echo "bad name $f"; exit 1; }
            supabase functions delete "$f" --project-ref "$PROJECT_REF" --yes || echo "$f was not deployed"
          done
